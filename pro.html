<!DOCTYPE html>
<html lang="en">
<head>

    <title>Currency convertor</title>
    <link href="pro.css" rel="stylesheet"/>
</head>
<body>
    <div class ="container ">
        <h2> Currency Convertor</h2> 
        <form>
            <div class="amount">
                <p>Enter Amount</p>
                <input value ="100 "  type="text"/>
            </div>
            
            <div class="dropdown">
                <div class="from">
                    <p>FROM</p>
                    <div class ="select-container">
                        <img src ="https://flagsapi.com/US/flat/64.png">
                        <select name="from">
                            
                        </select>
                    </div>
                </div>
                
                <div class="to">
                    <p> TO</p>
                    <div class ="select-container">
                        <img src ="https://flagsapi.com/IN/flat/64.png">
                        <select name="to">
                           
                        </select>
                    </div> 
                </div>
            </div>
            <div class ="msg">1USD = 90 INR</div>
            <button> Get Exchange Rate</button>
    </form>
    </div>
    
    <script src="country.js"></script>
 <script src="pro.js"></script>   
</body>
</html>
